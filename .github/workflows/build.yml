name: Build APK and IPA

on:
  push:
    branches: [main, master, 'copilot/**']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: money-manager-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

  build-ios:
    runs-on: macos-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Build shared iOS framework
        run: ./gradlew :shared:assembleXCFramework

      - name: Generate Xcode project
        working-directory: iosApp
        run: xcodegen generate

      - name: Build archive
        run: |
          set -e
          mkdir -p build/ios

          xcodebuild \
            -project "iosApp/MoneyManageriOS.xcodeproj" \
            -scheme "MoneyManageriOS" \
            -configuration Release \
            -sdk iphoneos \
            -archivePath "$PWD/build/ios/MoneyManageriOS.xcarchive" \
            clean archive

      - name: Export IPA
        run: |
          cat > ExportOptions.plist <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>development</string>
            <key>compileBitcode</key>
            <false/>
            <key>destination</key>
            <string>export</string>
          </dict>
          </plist>
          EOF

          xcodebuild \
            -exportArchive \
            -archivePath "$PWD/build/ios/MoneyManageriOS.xcarchive" \
            -exportPath "$PWD/build/ios/export" \
            -exportOptionsPlist ExportOptions.plist

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: money-manager-ipa
          path: build/ios/export/*.ipa
